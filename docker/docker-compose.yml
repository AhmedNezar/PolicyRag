services:

  fastapi:
      build: 
        context: ..
        dockerfile: docker/Dockerfile
      container_name: fastapi
      ports:
        - "8000:8000"
      volumes:
        - fastapi_data:/code/assets
      networks:
        - backend
      restart: always
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      env_file:
        - "./.env.app"
    
  postgres:
    image: pgvector/pgvector:0.8.3-pg18-trixie
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - "./.env.postgres"
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastapi"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.8.0-trixie
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    env_file:
      - "./.env.redis"
    networks:
      - backend
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-chatapp321}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "chatapp321", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: alembic upgrade head
    env_file:
      - "./.env.app"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"


networks:
  backend:

volumes:
  postgres_data:
  redis_data:
  fastapi_data: