services:
  postgres:
      image: postgres:latest
      container_name: postgres
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      env_file:
        - "./.env.postgres"
      networks:
        - backend
      restart: always

  redis:
    image: redis:8.8.0-trixie
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    env_file:
      - "./.env.redis"
    networks:
      - backend
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-chatapp321}"]


networks:
  backend:

volumes:
  postgres_data:
  redis_data: